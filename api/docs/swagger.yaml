basePath: /api
definitions:
  domain.AuditLog:
    properties:
      changed_at:
        type: string
      changed_by:
        type: string
      id:
        type: integer
      new_data:
        type: string
      old_data:
        type: string
      operation:
        type: string
      record_id:
        type: integer
      table_name:
        type: string
    type: object
  domain.Customer:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      phone:
        type: string
      vip_level:
        type: integer
    type: object
  domain.CustomerTotalSpent:
    properties:
      customer_id:
        type: integer
      full_name:
        type: string
      total_spent:
        type: number
    type: object
  domain.Dish:
    properties:
      category_id:
        type: integer
      cook_time_minutes:
        type: integer
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
    type: object
  domain.DishAvailability:
    properties:
      all_products_available:
        type: boolean
      can_be_ordered:
        type: boolean
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
    type: object
  domain.DishIngredientDetail:
    properties:
      product_id:
        type: integer
      product_name:
        type: string
      quantity:
        type: number
      unit:
        type: string
    type: object
  domain.DishWithIngredients:
    properties:
      category_id:
        type: integer
      dish_id:
        type: integer
      ingredients:
        items:
          $ref: '#/definitions/domain.DishIngredientDetail'
        type: array
      name:
        type: string
      price:
        type: number
    type: object
  domain.Employee:
    properties:
      email:
        type: string
      full_name:
        type: string
      hired_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      phone:
        type: string
      role_id:
        type: integer
    type: object
  domain.ImportError:
    properties:
      created_at:
        type: string
      entity:
        type: string
      error_message:
        type: string
      id:
        type: integer
      raw_data:
        type: string
    type: object
  domain.InventoryItem:
    properties:
      in_stop_list:
        type: boolean
      is_available:
        type: boolean
      name:
        type: string
      product_id:
        type: integer
      quantity:
        type: number
      unit:
        type: string
    type: object
  domain.LowStockProduct:
    properties:
      is_available:
        type: boolean
      name:
        type: string
      product_id:
        type: integer
      quantity:
        type: number
      unit:
        type: string
    type: object
  domain.MenuCategory:
    properties:
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
    type: object
  domain.Order:
    properties:
      created_at:
        type: string
      customer_id:
        type: integer
      id:
        type: integer
      reservation_id:
        type: integer
      shift_id:
        type: integer
      status:
        type: string
      table_id:
        type: integer
      waiter_id:
        type: integer
    type: object
  domain.OrderItem:
    properties:
      comment:
        type: string
      dish_id:
        type: integer
      id:
        type: integer
      order_id:
        type: integer
      price_at_moment:
        type: number
      quantity:
        type: integer
    type: object
  domain.OrderWithTotal:
    properties:
      created_at:
        type: string
      customer_id:
        type: integer
      id:
        type: integer
      reservation_id:
        type: integer
      shift_id:
        type: integer
      status:
        type: string
      table_id:
        type: integer
      total_amount:
        type: number
      waiter_id:
        type: integer
    type: object
  domain.Payment:
    properties:
      amount:
        type: number
      id:
        type: integer
      method:
        type: string
      order_id:
        type: integer
      paid_at:
        type: string
      status:
        type: string
    type: object
  domain.PopularDish:
    properties:
      dish_id:
        type: integer
      name:
        type: string
      portions_sold:
        type: integer
      revenue:
        type: number
      times_ordered:
        type: integer
    type: object
  domain.Product:
    properties:
      cost_price:
        type: number
      id:
        type: integer
      is_available:
        type: boolean
      name:
        type: string
      unit:
        type: string
    type: object
  domain.Reservation:
    properties:
      created_at:
        type: string
      customer_id:
        type: integer
      id:
        type: integer
      reserved_from:
        type: string
      reserved_to:
        type: string
      status:
        type: string
      table_id:
        type: integer
    type: object
  domain.RestaurantTable:
    properties:
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      seats:
        type: integer
      table_number:
        type: integer
    type: object
  domain.Shift:
    properties:
      actual_revenue:
        type: number
      closed_at:
        type: string
      closed_by:
        type: integer
      expected_revenue:
        type: number
      id:
        type: integer
      note:
        type: string
      opened_at:
        type: string
      opened_by:
        type: integer
      status:
        type: string
    type: object
  domain.ShiftRevenue:
    properties:
      avg_check:
        type: number
      closed_at:
        type: string
      opened_at:
        type: string
      orders_count:
        type: integer
      shift_id:
        type: integer
      total_revenue:
        type: number
    type: object
  domain.TableAvailability:
    properties:
      is_active:
        type: boolean
      is_available:
        type: boolean
      seats:
        type: integer
      table_id:
        type: integer
      table_number:
        type: integer
    type: object
  domain.WaiterPerformance:
    properties:
      avg_check:
        type: number
      full_name:
        type: string
      orders_count:
        type: integer
      total_revenue:
        type: number
      waiter_id:
        type: integer
    type: object
  handlers.addItemRequest:
    properties:
      comment:
        type: string
      dish_id:
        type: integer
      quantity:
        type: integer
    type: object
  handlers.closeOrderRequest:
    properties:
      payment_method:
        type: string
    type: object
  handlers.closeShiftRequest:
    properties:
      closed_by:
        type: integer
      note:
        type: string
    type: object
  handlers.openShiftRequest:
    properties:
      expected_revenue:
        type: number
      note:
        type: string
      opened_by:
        type: integer
    type: object
  handlers.orderRequest:
    properties:
      customer_id:
        type: integer
      items:
        items:
          $ref: '#/definitions/domain.OrderItem'
        type: array
      reservation_id:
        type: integer
      shift_id:
        type: integer
      status:
        type: string
      table_id:
        type: integer
      waiter_id:
        type: integer
    type: object
  handlers.reservationCheckRequest:
    properties:
      guests_count:
        type: integer
      reserved_from:
        type: string
      reserved_to:
        type: string
      table_id:
        type: integer
    type: object
info:
  contact: {}
  description: REST API for restaurant hall, orders, and warehouse management
  title: Restaurant Management System API
  version: "1.0"
paths:
  /audit:
    get:
      parameters:
      - description: table name
        in: query
        name: table_name
        type: string
      - description: record id
        in: query
        name: record_id
        type: integer
      - description: from datetime (RFC3339)
        in: query
        name: from
        type: string
      - description: to datetime (RFC3339)
        in: query
        name: to
        type: string
      - description: limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.AuditLog'
            type: array
      summary: List audit log
      tags:
      - audit
  /batch-import/products:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
      summary: Batch import products from JSON array or CSV (name,unit,cost_price,is_available)
      tags:
      - batch-import
  /customers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Customer'
            type: array
      summary: List customers
      tags:
      - customers
    post:
      consumes:
      - application/json
      parameters:
      - description: customer
        in: body
        name: customer
        required: true
        schema:
          $ref: '#/definitions/domain.Customer'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Customer'
      summary: Create customer
      tags:
      - customers
  /customers/{id}:
    delete:
      parameters:
      - description: customer id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Delete customer
      tags:
      - customers
    put:
      consumes:
      - application/json
      parameters:
      - description: customer id
        in: path
        name: id
        required: true
        type: integer
      - description: customer
        in: body
        name: customer
        required: true
        schema:
          $ref: '#/definitions/domain.Customer'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Customer'
      summary: Update customer
      tags:
      - customers
  /customers/{id}/total-spent:
    get:
      parameters:
      - description: customer id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CustomerTotalSpent'
      summary: Get total spent by customer
      tags:
      - customers
  /dishes:
    get:
      parameters:
      - description: limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Dish'
            type: array
      summary: List dishes
      tags:
      - dishes
    post:
      consumes:
      - application/json
      parameters:
      - description: dish
        in: body
        name: dish
        required: true
        schema:
          $ref: '#/definitions/domain.Dish'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Dish'
      summary: Create or update dish
      tags:
      - dishes
  /dishes/{id}:
    delete:
      parameters:
      - description: dish id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Delete dish
      tags:
      - dishes
  /dishes/{id}/ingredients:
    get:
      parameters:
      - description: dish id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.DishWithIngredients'
      summary: Get dish ingredients
      tags:
      - dishes
  /dishes/available:
    get:
      parameters:
      - description: category id
        in: query
        name: category_id
        type: integer
      - description: max price
        in: query
        name: max_price
        type: number
      - description: limit
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.DishAvailability'
            type: array
      summary: List dishes available for ordering
      tags:
      - dishes
  /employees:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Employee'
            type: array
      summary: List employees
      tags:
      - employees
    post:
      consumes:
      - application/json
      parameters:
      - description: employee
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/domain.Employee'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Employee'
      summary: Create employee
      tags:
      - employees
  /employees/{id}:
    delete:
      parameters:
      - description: employee id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Delete employee
      tags:
      - employees
    put:
      consumes:
      - application/json
      parameters:
      - description: employee id
        in: path
        name: id
        required: true
        type: integer
      - description: employee
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/domain.Employee'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Employee'
      summary: Update employee
      tags:
      - employees
  /import-errors:
    get:
      parameters:
      - description: entity
        in: query
        name: entity
        type: string
      - description: from datetime (RFC3339)
        in: query
        name: from
        type: string
      - description: to datetime (RFC3339)
        in: query
        name: to
        type: string
      - description: limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ImportError'
            type: array
      summary: List import errors
      tags:
      - import-errors
  /menu-categories:
    get:
      produces:
