    post:
      consumes:
      - application/json
      parameters:
      - description: product
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/domain.Product'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Product'
      summary: Create or update product
      tags:
      - products
  /products/{id}:
    delete:
      parameters:
      - description: product id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Delete product
      tags:
      - products
  /products/low-stock:
    get:
      parameters:
      - description: quantity threshold
        in: query
        name: threshold
        type: number
      - description: limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.LowStockProduct'
            type: array
      summary: List products with low stock
      tags:
      - products
  /reports/dishes-availability:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.DishAvailability'
            type: array
      summary: Dishes availability
      tags:
      - reports
  /reports/dishes/popular:
    get:
      parameters:
      - description: limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.PopularDish'
            type: array
      summary: Popular dishes
      tags:
      - reports
  /reports/inventory:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.InventoryItem'
            type: array
      summary: Inventory report
      tags:
      - reports
  /reports/shift-revenue:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ShiftRevenue'
            type: array
      summary: Shift revenue view
      tags:
      - reports
  /reports/shifts:
    get:
      parameters:
      - description: from date (YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: to date (YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ShiftRevenue'
            type: array
      summary: Shift report for period
      tags:
      - reports
  /reports/waiters:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.WaiterPerformance'
            type: array
