      tags:
      - reports
  /reservations:
    get:
      parameters:
      - description: status filter
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Reservation'
            type: array
      summary: List reservations
      tags:
      - reservations
    post:
      consumes:
