      consumes:
      - application/json
      parameters:
      - description: order
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/handlers.orderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Order'
      summary: Create order with items
      tags:
      - orders
  /orders/{id}/add-item:
    post:
      consumes:
      - application/json
      parameters:
      - description: order id
        in: path
        name: id
        required: true
        type: integer
      - description: item
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/handlers.addItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.OrderItem'
      summary: Add order item with current dish price
      tags:
      - orders
  /orders/{id}/close:
    post:
      consumes:
      - application/json
      parameters:
      - description: order id
        in: path
        name: id
        required: true
        type: integer
      - description: payment request
        in: body
        name: request
        schema:
          $ref: '#/definitions/handlers.closeOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Close order and optionally create payment
      tags:
      - orders
  /orders/{id}/items:
    get:
      parameters:
      - description: order id
        in: path
        name: id
        required: true
        type: integer
