      parameters:
      - description: order id
        in: path
        name: id
        required: true
        type: integer
      - description: item id
        in: path
        name: itemId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Delete order item
      tags:
      - orders
  /orders/{id}/status:
    put:
      parameters:
      - description: order id
        in: path
        name: id
        required: true
        type: integer
      - description: new status
        in: query
        name: status
        required: true
        type: string
      responses:
        "200":
          description: OK
      summary: Update order status
      tags:
      - orders
  /payments:
