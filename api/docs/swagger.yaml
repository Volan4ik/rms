      parameters:
      - description: category
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/domain.MenuCategory'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.MenuCategory'
      summary: Create or update menu category
      tags:
      - menu-categories
  /menu-categories/{id}:
    delete:
      parameters:
      - description: category id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Delete menu category
      tags:
      - menu-categories
  /orders:
    get:
      parameters:
      - description: status filter
        in: query
        name: status
        type: string
      - description: limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Order'
            type: array
      summary: List orders
      tags:
      - orders
